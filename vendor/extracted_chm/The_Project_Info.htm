<p>When starting a new project, the Project Info dialogue will appear. 
 This table can be filled in with information about the project. This data

 via <span style="font-style: italic;">Window</span><span> &gt; </span><span 
 style="font-style: italic;">Project Info</span><span>.</span> </p>
