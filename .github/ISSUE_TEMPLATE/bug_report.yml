name: Bug Report
description: Create a report to help us improve the Dx38 Pro Web Console
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: input
    id: environment
    attributes:
      label: Operating System & Python Version
      description: What OS and Python version are you using?
      placeholder: "e.g., Windows 11 64-bit, Python 3.10.11"
    validations:
      required: true
  - type: dropdown
    id: connection_mode
    attributes:
      label: Connection Mode
      description: How is the Dx38 / DSP244 connected?
      options:
        - "Physical COM Port (RS-232 / RS-485)"
        - "USB-to-Serial Adapter"
        - "Demo / Offline Mode (no hardware)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Start application with 'python app.py'
        2. Open browser at 'http://127.0.0.1:5000'
        3. Click on ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Console Logs / Screenshots
      description: Paste any terminal output, traceback, or browser console errors here.
      render: shell
